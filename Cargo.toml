[package]
name = "avl-basic"
version = "1.7.0"
edition = "2021"
license = "MIT"
build = "build.rs"

[[bin]]
name = "avl-basic"
path = "src/main.rs"

[lib]
name = "avl_basic"
path = "src/lib.rs"

[dependencies]
crossterm = "0.27"
ctrlc = "3"
minifb = { version = "0.29", default-features = false, features = ["x11"] }
png = "0.17"
kira = { version = "=0.12.4", default-features = false, features = ["wav", "pcm", "ogg", "vorbis", "mp3", "flac"] }
cpal = { version = "=0.18.2", default-features = false }
tempfile = "3"
unicode-width = { version = "0.2.3", default-features = false }
unicode-segmentation = { version = "1", default-features = false }

[target.'cfg(all(target_os = "windows", target_arch = "x86_64"))'.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9.5", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "=0.18.2", default-features = false, features = ["pulseaudio"] }
pulseaudio = "=0.3.1"
raw-window-handle = "0.6"
x11-dl = "2.21"
x11rb = { version = "=0.13.2", features = ["present", "dri3", "render"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
embed-resource = "3.0.9"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
