[package]
name = "avl-basic"
version = "1.6.1"
edition = "2021"
license = "GPL-3.0-or-later"
build = "build.rs"

[[bin]]
name = "avl-basic"
path = "src/main.rs"

[lib]
name = "avl_basic"
path = "src/lib.rs"

[dependencies]
crossterm = "0.27"
ctrlc = "3"
minifb = { version = "0.28", default-features = false, features = ["x11"] }
png = "0.17"
kira = { version = "=0.12.4", default-features = false, features = ["wav", "pcm", "ogg", "vorbis", "mp3", "flac"] }
cpal = { version = "=0.18.2", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "=0.18.2", default-features = false, features = ["pulseaudio"] }
pulseaudio = "=0.3.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
embed-resource = "3.0.9"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
